<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My everydays</title>
  <link rel="stylesheet" href="css/valentine.css" />

  <style>
    .responsive {
      width: 100%;
      max-width: 400px; /* ปรับได้ตามต้องการ */
      height: auto;
      display: block;
      margin: 20px auto;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div id="valentineQuestion">
    <b>What day is it today?</b>
  </div>

  <button
    class="answerButton"
    onclick="location.href='thankyou.html'"
  >
    2-month anniversary(｡♥‿♥｡)
  </button>

  <button class="answerButton" id="noButton">
    Sunday (╥﹏╥)
  </button>

  <br />

  <video
    class="responsive"
    autoplay
    muted
    loop
    playsinline
  >
    <source src="cat.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    document
      .getElementById("noButton")
      .addEventListener("click", function () {
        var yesButton = document.querySelector(
          'button[onclick*="thankyou.html"]'
        );

        var currentFontSize = parseInt(
          window.getComputedStyle(yesButton).fontSize
        );

        yesButton.style.fontSize =
          currentFontSize + 10 + "px";
      });
  </script>
</body>
</html>
